  <!-- background music (public pages + login) -->
  <audio id="bg-music" preload="auto"></audio>
  <div class="music-controls" id="music-controls">
    <button class="music-btn" id="music-btn" type="button" aria-label="Toggle background music" aria-pressed="false">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="label">Music</span>
    </button>
    <input type="range" id="music-vol" class="music-vol" min="0" max="1" step="0.05" value="0.3" aria-label="Background music volume">
  </div>
  <script>
    var BRAND = <?!= brandJson ?>;
    BRAND = BRAND || {};
    if (!BRAND.logoUrl) BRAND.logoUrl = 'https://drive.google.com/thumbnail?id=1LDjsF_70W2BpttMyLxfmltABCyUSPeHl';
    if (!BRAND.cbsLogoUrl) BRAND.cbsLogoUrl = 'https://drive.google.com/thumbnail?id=1rovoohmsc10VxMnig2NbrDv5_aaH9ukJ';
    if (BRAND.heroBgUrl) document.documentElement.style.setProperty('--hero-img', 'url("' + BRAND.heroBgUrl + '")');
    if (BRAND.journeyImgUrl) {
      var ji = document.querySelector('.journey-img');
      if (ji) ji.src = BRAND.journeyImgUrl;
    }

    /* ================= SHARED HELPERS ================= */
    function esc(v) { return String(v === undefined || v === null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function call(fn) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve, reject) {
        var r = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (e) { reject(new Error(e && e.message ? e.message : String(e))); });
        r[fn].apply(r, args);
      });
    }
    function readFileInput(input) {
      return new Promise(function (resolve, reject) {
        var file = input.files[0];
        if (!file) { reject(new Error('Please choose a file.')); return; }
        if (file.size > 1024 * 1024) { reject(new Error('File must be under 1 MB.')); return; }
        if (['image/jpeg', 'image/png'].indexOf(file.type) === -1) { reject(new Error('Only JPG or PNG allowed.')); return; }
        var reader = new FileReader();
        reader.onload = function () { resolve({ name: file.name, mimeType: file.type, dataUrl: reader.result }); };
        reader.onerror = function () { reject(new Error('Could not read file.')); };
        reader.readAsDataURL(file);
      });
    }

    /* ================= THEME (light / dark) ================= */
    function currentTheme() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
    function themeIcon() { return currentTheme() === 'dark' ? '&#9788;' : '&#9790;'; }
    function toggleTheme() {
      var next = currentTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('kms-pg-theme', next); } catch (e) {}
      refreshThemeIcons();
    }
    function refreshThemeIcons() {
      var btns = document.querySelectorAll('[data-theme-icon]');
      for (var i = 0; i < btns.length; i++) btns[i].innerHTML = themeIcon();
    }
    function themeFabHtml() {
      return '<button type="button" class="theme-fab" data-action="toggle-theme" data-theme-icon title="Toggle light/dark theme" aria-label="Toggle theme">' + themeIcon() + '</button>';
    }
    document.addEventListener('click', function (e) {
      var el = e.target && e.target.closest ? e.target.closest('[data-action="toggle-theme"]') : null;
      if (el) toggleTheme();
    });
    document.addEventListener('DOMContentLoaded', refreshThemeIcons);
    if (document.readyState !== 'loading') refreshThemeIcons();

    /* ========== PUBLIC PAGES: floating rail, scroll progress, reveal ==========
       Injected here once so every public page gets the same quick-access rail
       and animations (the SPA login page is skipped). */
    (function publicUi() {
      if (!document.querySelector('.public-topbar')) return;   // public pages only
      var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      var icons = {
        contact: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 3z"/><path d="M8 9h8M8 12h5"/></svg>',
        register: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="M8 8l4-4 4 4"/><path d="M5 16v3h14v-3"/></svg>',
        portal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
        top: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6"/><path d="M6 12l6-6 6 6"/></svg>'
      };
      var rail = document.createElement('nav');
      rail.className = 'fab-rail';
      rail.setAttribute('aria-label', 'Quick actions');
      rail.innerHTML =
        '<a class="fab fab-contact" href="?page=contact" aria-label="Contact the department">' + icons.contact + '<span class="fab-label">Contact</span></a>' +
        '<a class="fab fab-apply" href="?page=register" aria-label="Register as a new student">' + icons.register + '<span class="fab-label">Register</span></a>' +
        '<a class="fab fab-portal" href="?page=login" aria-label="Open the student and staff portal">' + icons.portal + '<span class="fab-label">Portal</span></a>' +
        '<button class="fab fab-top" type="button" id="fab-top" aria-label="Back to top">' + icons.top + '<span class="fab-label">Top</span></button>';
      document.body.appendChild(rail);
      var bar = document.createElement('div');
      bar.className = 'scroll-progress';
      bar.id = 'scroll-progress';
      document.body.appendChild(bar);
      rail.querySelector('#fab-top').addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
      });
      function onScroll() {
        var doc = document.documentElement;
        var max = doc.scrollHeight - window.innerHeight;
        var y = window.pageYOffset || doc.scrollTop || 0;
        bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, y / max) : 0) + ')';
        rail.classList.toggle('ready', y > 120);
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      // reveal on scroll (headings, leads, cards); no-ops with reduced motion
      var items = [];
      function add(el) { if (el && items.indexOf(el) === -1) items.push(el); }
      [].slice.call(document.querySelectorAll('main .pub-section > h2, main .pub-section > p.lead, main .card, .card-grid > *')).forEach(function (el) { add(el); });
      if (reduced || !('IntersectionObserver' in window)) return;
      items.forEach(function (el, i) {
        el.classList.add('reveal');
        el.style.transitionDelay = (Math.min(i % 4, 3) * 70) + 'ms';
      });
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) { en.target.classList.add('is-visible'); io.unobserve(en.target); }
        });
      }, { rootMargin: '0px 0px -6% 0px', threshold: 0.05 });
      items.forEach(function (el) { io.observe(el); });
    })();

    /* ================= BACKGROUND MUSIC =================
       Playlist served from the live static host (files identical to
       PG_Portal/audio/music*.mp3). Starts on first user interaction;
       pause/mute + volume remembered. Controls hide (and music pauses)
       once signed in. */
    var MUSIC = (function music() {
      var audio = document.getElementById('bg-music');
      var btn = document.getElementById('music-btn');
      var controls = document.getElementById('music-controls');
      var vol = document.getElementById('music-vol');
      var MUTE_KEY = 'kms_pg_music_muted';
      var VOL_KEY = 'kms_pg_music_volume';
      var HOST = 'https://kingsmetroschools.vercel.app/';
      var TRACKS = [HOST + 'music1.mp3', HOST + 'music2.mp3', HOST + 'music3.mp3'];
      var DEFAULT_VOL = 0.3;
      var idx = 0, started = false, consecutiveErrors = 0;
      if (!audio || !btn) return { sync: function () {} };
      function show() { if (controls) controls.classList.add('show'); }
      function hide() { if (controls) controls.classList.remove('show'); }
      function reflect() {
        btn.classList.toggle('muted', audio.muted || audio.paused);
        btn.setAttribute('aria-pressed', String(!audio.muted && !audio.paused));
      }
      function rawPlay() {
        var p = audio.play();
        if (p && p.catch) p.catch(function () {});
      }
      function play() {
        audio.muted = false;
        rawPlay();
        reflect();
      }
      function pause() {
        audio.pause();
        audio.muted = true;
        reflect();
      }
      function applyVolume(v) {
        v = Number(v);
        if (isNaN(v)) return;
        v = Math.min(1, Math.max(0, v));
        audio.volume = v;
        if (vol && vol.value !== String(v)) vol.value = String(v);
      }
      function loadTrack(i) {
        idx = ((i % TRACKS.length) + TRACKS.length) % TRACKS.length;
        audio.src = TRACKS[idx];
      }
      function advance() {
        loadTrack(idx + 1);
        if (started && !audio.muted) rawPlay();
      }
      var savedVolRaw = null;
      try { savedVolRaw = localStorage.getItem(VOL_KEY); } catch (e) {}
      var savedVol = savedVolRaw === null ? DEFAULT_VOL : Number(savedVolRaw);
      applyVolume(isNaN(savedVol) ? DEFAULT_VOL : savedVol);
      if (vol) {
        vol.addEventListener('input', function () {
          applyVolume(vol.value);
          try { localStorage.setItem(VOL_KEY, vol.value); } catch (err) {}
          if (started && audio.paused && !audio.muted) rawPlay();
        });
      }
      function firstStart() {
        if (started) return; started = true;
        var muted = null;
        try { muted = localStorage.getItem(MUTE_KEY); } catch (err) {}
        if (muted === '1') { audio.muted = true; reflect(); return; }
        if (controls && controls.classList.contains('show')) play();
      }
      audio.addEventListener('ended', advance);
      audio.addEventListener('playing', function () { consecutiveErrors = 0; });
      audio.addEventListener('error', function () {
        if (consecutiveErrors >= TRACKS.length) { hide(); return; }
        consecutiveErrors++;
        advance();
      });
      loadTrack(0);
      reflect();
      ['click', 'touchstart', 'pointerdown', 'keydown'].forEach(function (ev) {
        document.addEventListener(ev, firstStart, { passive: true });
      });
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        started = true;
        if (audio.paused || audio.muted) { play(); try { localStorage.setItem(MUTE_KEY, '0'); } catch (err) {} }
        else { pause(); try { localStorage.setItem(MUTE_KEY, '1'); } catch (err) {} }
      });
      return {
        /** Show controls on public pages; pause + hide once signed in. */
        sync: function (signedIn) {
          if (signedIn) { hide(); if (!audio.paused) pause(); }
          else show();
        }
      };
    })();
    MUSIC.sync(false);
  </script>
